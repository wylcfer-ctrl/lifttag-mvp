# Render.com Blueprint for the LiftTag MVP.
#
# CURRENT DEPLOYMENT (2026-08-16): Render Free plan — disposable test
# environment only. This is NOT production architecture.
#
# Render's Free plan has an ephemeral filesystem: it does not offer a
# persistent disk, and does not run `preDeployCommand` the way a paid plan
# does. This blueprint reflects that reality —
#   - no `disk:` block;
#   - no `preDeployCommand`;
#   - `plan: free`.
# The SQLite database (path below) is created fresh in the service's own
# ephemeral filesystem on every deploy/restart, and the app seeds its five
# fixed demo assets automatically at startup (see app.py / seed_data.py) —
# no manual step is required either way. See README.md "Free-tier
# disposable deployment" for exactly what this means and does not mean.
#
# The previously-prepared PAID configuration (Starter plan + persistent
# disk + preDeployCommand, so real check/audit history survives restarts)
# remains fully documented in docs/decision-log.md and README.md, and
# remains the correct choice for any deployment beyond a disposable demo.
# It is not deleted — see the commented block at the bottom of this file
# for how to restore it when/if a paid plan is approved again.
#
# This file only prepares the deployment. Nothing is deployed by writing
# it — deployment happens when a human connects this repo in the Render
# dashboard and explicitly approves it.

services:
  - type: web
    name: lifttag-mvp
    runtime: python
    plan: free
    region: oregon          # change to whichever region is closest/preferred
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_PATH
        value: lifttag.db     # relative path in the service's own ephemeral filesystem — resets on redeploy/restart, by design, on the free plan
      - key: PYTHON_VERSION
        value: 3.11.9
      # BASE_URL is intentionally NOT set here: seed.py (and the automatic
      # startup seeding in app.py) automatically fall back to Render's own
      # RENDER_EXTERNAL_URL (provided for free by Render on every service),
      # so the printed/seeded tap URLs always match the real deployed
      # hostname with no manual entry needed.

# --- To restore the paid, persistent configuration later ------------------
# (approved 2026-08-16, superseded for this disposable demo the same day —
# see docs/decision-log.md for the full history). Replace the `services:`
# block above with:
#
# services:
#   - type: web
#     name: lifttag-mvp
#     runtime: python
#     plan: starter          # cheapest plan that supports a persistent disk
#     region: oregon
#     buildCommand: "pip install -r requirements.txt"
#     preDeployCommand: "python seed.py"
#     startCommand: "gunicorn app:app"
#     envVars:
#       - key: DATABASE_PATH
#         value: /var/data/lifttag.db
#       - key: PYTHON_VERSION
#         value: 3.11.9
#     disk:
#       name: lifttag-data
#       mountPath: /var/data
#       sizeGB: 1
#
# With that configuration, real check/audit/quarantine history survives
# restarts and redeploys, because it lives on a genuinely persistent disk
# instead of the free plan's ephemeral filesystem. It would also make the
# random-per-deploy Tag ID scheme (models.new_tag_id()) viable again,
# since URLs would no longer need to survive a filesystem being recreated
# from scratch — though the fixed demo IDs in seed_data.py would still
# work fine there too.
